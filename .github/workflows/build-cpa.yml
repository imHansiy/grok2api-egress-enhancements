name: build-cpa

on:
  push:
    branches:
      - cpa
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Tidy modules
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: so
            cc: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: so
            cc: aarch64-linux-gnu-gcc
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: dll
            cc: x86_64-w64-mingw32-gcc
    defaults:
      run:
        working-directory: cpa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Tidy modules
        run: go mod tidy

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu

      - name: Build plugin
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: go build -buildmode=c-shared -o "cpa-${{ matrix.target }}.${{ matrix.ext }}" .

      - name: Verify output
        run: |
          file "cpa-${{ matrix.target }}.${{ matrix.ext }}"
          ls -la "cpa-${{ matrix.target }}.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpa-${{ matrix.target }}
          path: cpa/cpa-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p dist
          for d in artifacts/cpa-*/; do
            name=$(basename "$d")
            file=$(find "$d" -type f | head -1)
            cp "$file" "dist/${name}"
          done
          (cd dist && shasum -a 256 * > checksums.txt)
          ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
